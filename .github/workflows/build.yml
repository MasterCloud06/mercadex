name: build

on:
  push:
    branches: [ main, develop, 'fix/**', 'release/**', 'herramientas/**' ]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet build Mercadex.sln -c Release
      - run: dotnet test Mercadex.sln -c Release --no-build
      - name: Verificar que el modelo coincide con las migraciones
        env:
          MERCADEX_JWT_KEY: clave-de-diseno-solo-para-verificar-migraciones-0123456789
          ConnectionStrings__MercadexDatabase: Host=localhost;Database=diseno;Username=diseno;Password=diseno
        run: |
          dotnet tool install --global dotnet-ef --version "10.*"
          dotnet ef migrations has-pending-model-changes --project src/Mercadex.Infrastructure --startup-project src/Mercadex.Api

  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet build Desktop/Mercadex.Desktop.App/Mercadex.Desktop.App.csproj -c Release
      - name: Abrir todas las pantallas (prueba de humo de la interfaz)
        timeout-minutes: 10
        run: dotnet test tests/Mercadex.Desktop.Tests/Mercadex.Desktop.Tests.csproj -c Release --logger "console;verbosity=normal"
