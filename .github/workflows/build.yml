name: build

on:
  push:
    branches: [ main, develop, 'fix/**', 'release/**' ]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet build Mercadex.sln -c Release
      - run: dotnet test Mercadex.sln -c Release --no-build

  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet build Desktop/Mercadex.Desktop.App/Mercadex.Desktop.App.csproj -c Release
