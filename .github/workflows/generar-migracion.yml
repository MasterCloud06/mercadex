name: generar-migracion

# Genera una migracion de EF Core con la herramienta oficial y la sube
# a la misma rama. Uso: push a una rama "herramientas/migracion-*"
# con el nombre de la migracion en .github/migracion-nombre.txt
on:
  push:
    branches: [ 'herramientas/migracion-*' ]

permissions:
  contents: write

jobs:
  migracion:
    runs-on: ubuntu-latest
    env:
      MERCADEX_JWT_KEY: clave-de-diseno-solo-para-generar-migraciones-0123456789
      ConnectionStrings__MercadexDatabase: Host=localhost;Database=diseno;Username=diseno;Password=diseno
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet tool install --global dotnet-ef --version "10.*"
      - run: dotnet build src/Mercadex.Api/Mercadex.Api.csproj
      - name: Generar migracion
        run: |
          NOMBRE=$(tr -d '[:space:]' < .github/migracion-nombre.txt)
          if ls src/Mercadex.Infrastructure/Persistence/Migrations/*_"$NOMBRE".cs >/dev/null 2>&1; then
            echo "La migracion $NOMBRE ya existe"; exit 0; fi
          dotnet ef migrations add "$NOMBRE" \
            --project src/Mercadex.Infrastructure \
            --startup-project src/Mercadex.Api \
            --output-dir Persistence/Migrations
      - name: Subir migracion
        run: |
          git config user.name "mercadex-ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A src/Mercadex.Infrastructure/Persistence/Migrations
          git diff --cached --quiet || git commit -m "chore(db): migracion $(tr -d '[:space:]' < .github/migracion-nombre.txt) generada por dotnet ef"
          git push
